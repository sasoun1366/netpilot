name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[packaging,dev]"
      - name: Run the test suite before shipping anything
        run: python -m pytest -q
      - name: Build CLI executable
        run: pyinstaller packaging/netpilot-cli.spec
      - name: Build desktop executable
        run: pyinstaller packaging/netpilot-gui.spec
      - name: Rename artifacts with the version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp dist/netpilot.exe "out/netpilot-${version}-windows-cli.exe"
          cp dist/netpilot-gui.exe "out/netpilot-${version}-windows-desktop.exe"
      - name: Smoke-test the frozen CLI
        shell: bash
        run: |
          ./out/netpilot-*-windows-cli.exe --version
          ./out/netpilot-*-windows-cli.exe --data-dir ./smoke doctor || true
      - name: Smoke-test the frozen desktop app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Start-Process gives this GUI-subsystem executable **no console**, which is
          # what a user double-clicking the download gets. Launching it from a shell is
          # not the same test: the shell hands over its console, sys.stderr stops being
          # None, and a build that dies on startup looks perfectly healthy. That is how
          # v0.1.1 shipped with a crash-before-the-window bug.
          $exe = Get-ChildItem out/netpilot-*-windows-desktop.exe | Select-Object -First 1
          Write-Host "launching $($exe.Name)"
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $proc.WaitForExit(30000)) { Stop-Process -Id $proc.Id -Force }

          $dir = Join-Path $env:USERPROFILE '.netpilot'
          foreach ($name in 'netpilot.log', 'netpilot-fatal.log', 'netpilot-crash.log') {
            $file = Join-Path $dir $name
            if (Test-Path $file) { Write-Host "--- $name ---"; Get-Content $file }
          }

          $log = Join-Path $dir 'netpilot.log'
          if ((Test-Path $log) -and ((Get-Content $log -Raw) -match 'core ready=True')) {
            Write-Host 'the desktop build started, brought its core up and wrote its log'
          } else {
            Write-Error 'the desktop build never reached "core ready=True" — nothing was released'
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: out/*.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows executables
        uses: actions/download-artifact@v4
        with:
          name: windows-executables
          path: out
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: out/*.exe
