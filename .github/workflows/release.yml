name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[packaging,dev]"
      - name: Run the test suite before shipping anything
        run: python -m pytest -q
      - name: Build CLI executable
        run: pyinstaller packaging/netpilot-cli.spec
      - name: Build desktop executable
        run: pyinstaller packaging/netpilot-gui.spec
      - name: Rename artifacts with the version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp dist/netpilot.exe "out/netpilot-${version}-windows-cli.exe"
          cp dist/netpilot-gui.exe "out/netpilot-${version}-windows-desktop.exe"
      - name: Smoke-test the frozen CLI
        shell: bash
        run: |
          ./out/netpilot-*-windows-cli.exe --version
          ./out/netpilot-*-windows-cli.exe --data-dir ./smoke doctor || true
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: out/*.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows executables
        uses: actions/download-artifact@v4
        with:
          name: windows-executables
          path: out
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: out/*.exe
