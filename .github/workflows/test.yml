name: tests

on:
  push:
  pull_request:

jobs:
  core:
    name: core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the test suite
        run: pytest -q

  windows:
    name: core / windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the test suite
        run: pytest -q

  gui-import:
    name: desktop app imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the GUI extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Load every desktop module offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from netpilot.desktop.main_window import MainWindow; from netpilot.desktop.widgets import DARK_QSS; from netpilot.desktop.bridge import CoreThread; from netpilot.desktop.widgets import Sparkline, StatePill; print('desktop modules import cleanly')"
